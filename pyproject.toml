[project]
name = "info-extract"
version = "0.1.0"
description = "Invoice information extraction pipeline for RLVR"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "pydantic>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
extract-eval = "info_extract.runner.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/info_extract"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
