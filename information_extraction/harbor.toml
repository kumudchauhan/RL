[project]
name = "invoice-extraction"
version = "0.1.0"
description = "Information extraction from invoices and order confirmations"

[dataset]
name = "invoice_extraction"
path = "annotations/"
loader = "info_extract.dataset.loader:DatasetLoader"

[agent]
name = "claude_extractor"
module = "info_extract.agent.extraction_agent:ExtractionAgent"
default_model = "claude-sonnet-4-20250514"

[verifier]
module = "info_extract.verifiers.composite:CompositeVerifier"

[verifier.weights]
field_accuracy = 0.20
numeric_accuracy = 0.30
line_item_f1 = 0.35
detail_accuracy = 0.15

[runner]
module = "info_extract.runner.evaluate:EvaluationRunner"
results_dir = "results/"
capture_rollouts = true
